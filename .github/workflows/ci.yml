name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lints src/, test/ and example/.
      - run: npm run lint
      - run: npm run typecheck
      # The live tests in test/integration.test.ts skip: TELE_API_* are not set here.
      - run: npm test
      - name: dist is up to date
        run: |
          npm run build
          test -z "$(git status --porcelain -- dist)" || (git status --porcelain -- dist; echo "dist/ is stale: run npm run build and commit it"; exit 1)

  example:
    # Builds and typechecks example/ against this checkout's package (packed like a git install), so the
    # example can't drift from the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Point the example at the packed package
        working-directory: example
        run: npm pkg set "dependencies.@tele/nextjs-ui=file:$(ls "$RUNNER_TEMP"/tele-nextjs-ui-*.tgz)"
      - run: npm install --no-audit --no-fund
        working-directory: example
      - run: npm run build
        working-directory: example
      - run: npm run typecheck
        working-directory: example
